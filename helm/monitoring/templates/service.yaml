apiVersion: v1
kind: Service
metadata:
  name: {{ include "monitoring.fullname" . }}-backend
  labels:
    app.kubernetes.io/component: backend
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.backend.type }}
  ports:
    - port: {{ .Values.service.backend.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: backend
    {{- include "monitoring.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "monitoring.fullname" . }}-frontend
  labels:
    app.kubernetes.io/component: frontend
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.frontend.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: frontend
    {{- include "monitoring.selectorLabels" . | nindent 4 }}
