apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring.fullname" . }}-worker
  labels:
    app.kubernetes.io/component: worker
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.worker.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      {{- include "monitoring.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/component: worker
        {{- include "monitoring.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info", "-c", "2"]
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          env:
            {{- range $k, $v := .Values.env.worker }}
            {{- if $v }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring.fullname" . }}-beat
  labels:
    app.kubernetes.io/component: beat
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: beat
      {{- include "monitoring.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: beat
        {{- include "monitoring.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: beat
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command: ["celery", "-A", "app.celery_app.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
