{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.env.backend.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.env.backend.REDIS_URL | quote }}
  SECRET_KEY: {{ .Values.env.backend.SECRET_KEY | quote }}
  INGEST_API_KEY: {{ .Values.env.backend.INGEST_API_KEY | quote }}
  SENTRY_DSN: {{ .Values.env.backend.SENTRY_DSN | quote }}
{{- end }}
