name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────
  # Pre-Deployment Quality Gate & Checks
  # ─────────────────────────────────────────────
  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate that .env.prod is NOT committed
        run: |
          if [ -f infrastructure/.env.prod ]; then
            echo "ERROR: infrastructure/.env.prod is committed to repository! This is a security risk."
            exit 1
          fi
          echo "OK: .env.prod is not committed."

      - name: Verify production dependencies
        run: |
          cd backend
          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt is missing in backend directory!"
            exit 1
          fi
          if grep -q "requirements-local.txt" Dockerfile; then
            echo "ERROR: Dockerfile copies/installs development dependencies (requirements-local.txt)!"
            exit 1
          fi
          echo "OK: Production dependencies verified."

      - name: Check for development-only files in repository
        run: |
          DEV_FILES="MonitoringAgent.spec MonitoringAgentInstaller.spec run_local_all_hidden.ps1 run_local_all_hidden.vbs stop_local_all_hidden.ps1 stop_local_all_hidden.vbs backend_err.log backend_out.log build/ dist/ data/"
          for file in $DEV_FILES; do
            if [ -e "$file" ]; then
              echo "ERROR: Development-only file or folder '$file' is present in repository!"
              exit 1
            fi
          done
          echo "OK: No development-only files found."

  # ─────────────────────────────────────────────
  # Backend: lint + tests
  # ─────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements-local.txt

      - name: Lint (flake8)
        run: |
          cd backend
          flake8 --max-line-length=120 --extend-ignore=E501,W503

      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/test_monitoring.db
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: test-secret-key-for-ci-only
          INITIAL_ADMIN_EMAIL: admin@test.com
          INITIAL_ADMIN_PASSWORD: Test1234!
          INGEST_API_KEY: test-ingest-key
          ENVIRONMENT: test
        run: |
          cd backend
          mkdir -p data
          python -m pytest tests/ -v --tb=short --asyncio-mode=auto

  # ─────────────────────────────────────────────
  # Frontend: lint + build
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          cd frontend
          npm run build

  # ─────────────────────────────────────────────
  # Go agent: build
  # ─────────────────────────────────────────────
  agent-build:
    name: Agent Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum

      - name: Build agent
        run: |
          cd agent
          go build -v ./...

      - name: Vet agent
        run: |
          cd agent
          go vet ./...

  # ─────────────────────────────────────────────
  # Docker builds (only on push to main/master)
  # ─────────────────────────────────────────────
  docker-backend:
    name: Docker — Backend
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/monitoring-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-frontend:
    name: Docker — Frontend
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/monitoring-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Helm lint (optional, requires helm CLI)
  # ─────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: helm lint helm/monitoring/
