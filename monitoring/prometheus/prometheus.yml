global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'agent'
    metrics_path: /metrics
    static_configs:
      - targets: ['agent:8001']

  - job_name: 'prober'
    metrics_path: /metrics
    static_configs:
      - targets: ['prober:8002']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Add more scrape jobs (agent, prober, exporters) as implemented
